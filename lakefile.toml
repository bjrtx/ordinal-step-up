# The Erdős–Rado negative stepping-up lemma for ordinal order types, as a
# self-contained project: `OrdinalStepUp/Solution.lean` imports nothing but
# Mathlib, and `OrdinalStepUp/Challenge.lean` restates its main theorem with a
# `sorry` for Comparator. See `comparator.json` and `formalization.yaml`.
name = "ordinal_step_up"
version = "0.1.0"
defaultTargets = ["OrdinalStepUp"]
lintDriver = "batteries/runLinter"

[leanOptions]
profiler = true
linter.style.setOption = true
linter.style.missingEnd = true
linter.style.cdot = true
linter.style.dollarSyntax = true
linter.style.lambdaSyntax = true
linter.style.longLine = true
linter.style.show = true
linter.style.openClassical = true

[[lean_lib]]
name = "OrdinalStepUp"
roots = ["OrdinalStepUp.Solution"]

# The Palomar Challenge. `OrdinalStepUp.Solution` is the development itself, so
# Comparator checks the development itself rather than a restatement of it.
# Kept out of `defaultTargets` so its deliberate `sorry` does not warn on every
# build. Build with `lake build Challenge`.
[[lean_lib]]
name = "Challenge"
roots = ["OrdinalStepUp.Challenge"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"
