fidelity:
  divergences: >-
    Colourings are total functions on all of Finset Ordinal, rather than 
    partial functions defined on the r-subsets of the ground set; their values
    elsewhere are immaterial and unconstrained. Since the colourings are total,
    kappa is not an ambient type but a bound on the sets quantified over: 
    subsets of Set.Iio kappa downstairs, and of its powerset upstairs.

    Order types upstairs are taken with respect to an arbitrary well-order on
    the powerset, obtained from well-ordering; the proof never uses which.

    The source's theta^- correction, needed there because a successor-length
    homogeneous set has a top point contributing no discrepancy, is
    unnecessary here: indecomposability forces theta to be a limit, so every
    point of such a set has a successor in it.


review:
