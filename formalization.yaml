# formalization.yaml v0.4.

version: "v0.4"

project:
  name: "Erdős–Rado negative stepping-up for ordinal order types"
  description: >-
    A Lean 4 formalisation of the Erdős–Rado negative stepping-up lemma in its
    order-type form: if a colouring of the r-subsets of kappa has no
    monochromatic subset of kappa of order type theta, then the stepped-up
    colouring of the (r+1)-subsets of 2^kappa has none either, provided theta
    is additively indecomposable (meaning a nontrivial power of omega, the
    first infinite ordinal).

    The construction compares two unrelated orders on 2^kappa -- an arbitrary
    well-order, and the lexicographic order given by the first place two sets
    differ -- and reads a colouring off the pattern of agreement between them
    along a chain, together with the sequence of discrepancies. Two colours are
    spent marking the chains where those patterns first deviate, and on the
    well-behaved chains the colouring copies the given one along the
    discrepancy map.
  authors:
    - "Bruno Jartoux"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Bruno Jartoux"

